<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Saucy Spoon</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-brand">
            <h1>Saucy Spoon<span>🍗</span></h1>
            <p>FOOD AND DRINK</p>
        </div>

        <div class="login-card">

            <p class="section-label text-center">WELCOME BACK</p>

            <h2 class="text-center">Sign In</h2>

            <p class="login-subtitle text-center">
                Enter your details to continue.
            </p>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="juwie-btn w-100">
                    Sign In →
                </button>

                <p id="loginMessage" class="text-center mt-3"></p>

            </form>

            <p class="signup-text text-center">
                Don't have an account?
                <a href="#" id="signupLink">Sign up</a>
            </p>

            <div class="login-divider">
                <span>GOOD FOOD, GREAT MOOD</span>
            </div>

        </div>

        <p class="login-copyright">
            © 2026 Saucy Spoon | Food and Drink
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
